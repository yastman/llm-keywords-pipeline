# Git hooks. Install both stages once per clone:
#   uv run pre-commit install --hook-type pre-commit --hook-type pre-push
#
# pre-commit stage: lint/format/hygiene on the staged files only.
# pre-push stage: the full-repo gate (lockfile, mypy, pytest with the coverage floor).
# There is no remote CI: these hooks are the only gate.
# Ruff runs from the uv environment so hooks and uv.lock use one ruff version.

repos:
  - repo: local
    hooks:
      # Linter (fixes imports, unused vars, style); covers src, tests, scripts and root files
      - id: ruff
        name: ruff check
        entry: uv run ruff check --force-exclude
        args: [--fix, --exit-non-zero-on-fix, --unsafe-fixes]
        language: system
        types_or: [python, pyi]
      # Formatter (Black-compatible); only files you commit, existing files are not mass-reformatted
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

  # Basic checks (JSON, TOML, YAML, whitespace, merge markers, large files, keys)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^(\.vscode/|\.claude/)
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        stages: [pre-commit]
      - id: detect-private-key
      - id: trailing-whitespace
        exclude: ^(archive/|.*\.csv$|.*\.md$)
        stages: [pre-commit]
      - id: end-of-file-fixer
        exclude: ^(archive/|.*\.csv$)
        stages: [pre-commit]

  # Full-repo checks before push
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: uv run pytest -q --cov-fail-under=20
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

default_language_version:
  python: python3

default_stages: [pre-commit]
